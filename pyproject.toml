[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "0.1.0"
description = "forge: 面向 AI 协作项目的一站式工具（scaffold / plan / inbox / workbench）"
readme = { "content-type" = "text/plain", "text" = "Run `forge new <path>`; see docs/design/ for the design." }
requires-python = ">=3.9"
license = { "text" = "MIT" }
dependencies = [
    "jsonschema>=4.0",
]

[project.scripts]
forge = "forge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["forge"]
include-package-data = true

[tool.setuptools.package-data]
forge = [
    "schemas/*.schema.json",
    "blueprints/*.schema.json",
    "blueprints/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
